[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "home-automation"
version = "0.1.0"
description = "Personal home automation with a Honeywell Evohome integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.4,<4",
    "evohome-async==3.0.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
home-automation = "home_automation.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/home_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
